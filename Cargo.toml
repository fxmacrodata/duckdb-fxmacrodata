[package]
name = "fxmacrodata"
version = "0.1.0"
edition = "2024"
description = "Query official macroeconomic, FX and central-bank data from DuckDB"
license = "MIT"
repository = "https://github.com/fxmacrodata/duckdb-fxmacrodata"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "fxmacrodata"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "~1.10505.0", features = ["loadable-extension", "vscalar"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
